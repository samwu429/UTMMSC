name: Keep the old address empty

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Write a blank page
        run: |
          mkdir site
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title></title><script>navigator.serviceWorker&&navigator.serviceWorker.getRegistrations&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});window.caches&&caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k)})})</script>' > site/index.html
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
